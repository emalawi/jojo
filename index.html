<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jojo BIS Learning</title>
<style>
    body {
        font-family: -apple-system, Roboto, Arial, sans-serif;
        background: #f4f4f5;
        margin: 0;
        padding: 16px;
    }
    h1 { font-size: 20px; color: #222; margin-bottom: 4px; }
    #status { font-size: 13px; margin-bottom: 12px; color: #888; }
    #status.online { color: #16a34a; }
    #status.offline { color: #dc2626; }

    input[type=text], input[type=date] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 8px;
    }

    button {
        padding: 12px 18px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        margin-right: 6px;
        margin-bottom: 6px;
    }
    button.secondary { background: #6b7280; }
    button.danger { background: #dc2626; }
    button:disabled { background: #a5a5a5; }

    #notesOutputBox {
        margin-top: 12px;
        padding: 14px;
        background: #111;
        color: #d1fae5;
        border-radius: 8px;
        white-space: pre-wrap;
        min-height: 100px;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.5;
        overflow-x: auto;
    }

    .card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
    }
    .card h3 { margin-top: 0; font-size: 15px; }

    .progress-bar-bg {
        background: #e4e4e7;
        border-radius: 6px;
        height: 10px;
        overflow: hidden;
        margin-top: 6px;
    }
    .progress-bar-fill {
        background: #16a34a;
        height: 100%;
        width: 0%;
        transition: width 0.3s;
    }

    .module-block {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        background: #fafafa;
    }
    small.hint { display: block; color: #888; margin-top: -4px; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>Jojo BIS Learning</h1>
<div id="status">Checking server status...</div>

<div class="card">
    <h3>Today's Module</h3>
    <div id="currentModuleInfo">Loading...</div>
    <div id="pdfLink"></div>
    <button class="secondary" onclick="extractTopics()">Extract Topics (run once per new PDF)</button>
    <div id="extractStatus" style="font-size:13px; color:#888;"></div>
</div>

<div class="card">
    <h3>Progress</h3>
    <div id="progressInfo">Loading...</div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill"></div></div>
</div>

<div class="card">
    <h3>AI Notes</h3>
    <button id="notesButton" onclick="getNotes()">Generate Notes</button>
    <div id="notesOutputBox">Click the button above to get simplified notes for your next subtopics.</div>
</div>

<div class="card">
    <h3>Timetable Editor</h3>
    <small class="hint">Sets which module is "today's module." Subtopics are extracted from the PDF automatically.</small>
    <div id="modulesContainer"></div>
    <button class="secondary" onclick="addModuleBlock()">+ Add Module</button>
    <button onclick="saveTimetable()">Save Timetable</button>
    <div id="timetableStatus" style="font-size:13px; color:#888; margin-top:6px;"></div>
</div>

<script>
const TUNNEL_CONFIG_URL = "https://raw.githubusercontent.com/emalawi/jojo/main/config/tunnel.json";
const GITHUB_PDF_BASE = "https://raw.githubusercontent.com/emalawi/jojo/main/BIS/";

let serverUrl = null;
let currentBisModule = null;

async function fetchTunnelUrl() {
    try {
        const resp = await fetch(TUNNEL_CONFIG_URL + "?t=" + Date.now());
        const data = await resp.json();
        serverUrl = data.url;
        return serverUrl;
    } catch (err) {
        document.getElementById('status').textContent = 'Could not load server config: ' + err.message;
        document.getElementById('status').className = 'offline';
        return null;
    }
}

async function pollStatus() {
    if (!serverUrl) await fetchTunnelUrl();
    if (!serverUrl) return;
    const statusEl = document.getElementById('status');
    try {
        const resp = await fetch(serverUrl + '/status');
        const data = await resp.json();
        statusEl.textContent = 'Server online — model: ' + data.model;
        statusEl.className = 'online';
    } catch (err) {
        statusEl.textContent = 'Server offline or unreachable';
        statusEl.className = 'offline';
    }
}

async function streamToBox(url, options, outputEl, doneCallback) {
    outputEl.textContent = '';
    try {
        const response = await fetch(url, options);

        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
            const data = await response.json();
            outputEl.textContent = data.error || JSON.stringify(data);
            if (doneCallback) doneCallback();
            return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n\n');
            buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                try {
                    const parsed = JSON.parse(line.slice(6));
                    if (parsed.event === 'token') {
                        outputEl.textContent += parsed.text;
                    } else if (parsed.event === 'done') {
                        if (doneCallback) doneCallback();
                    }
                } catch (e) {}
            }
        }
    } catch (err) {
        outputEl.textContent = 'Error: ' + err.message;
        if (doneCallback) doneCallback();
    }
}

async function loadCurrentModule() {
    if (!serverUrl) await fetchTunnelUrl();
    if (!serverUrl) return;
    const infoEl = document.getElementById('currentModuleInfo');
    const pdfEl = document.getElementById('pdfLink');

    try {
        const resp = await fetch(serverUrl + '/current-module');
        const data = await resp.json();
        if (data.error) {
            infoEl.textContent = data.error;
            pdfEl.innerHTML = '';
            currentBisModule = null;
            return;
        }
        infoEl.innerHTML = '<strong>' + data.module + ': ' + data.title + '</strong>';
        pdfEl.innerHTML = '<a href="' + GITHUB_PDF_BASE + data.module + '.pdf" target="_blank">View Original PDF</a>';
        currentBisModule = data.module;
        loadProgress();
    } catch (err) {
        infoEl.textContent = 'Error loading module: ' + err.message;
    }
}

async function extractTopics() {
    if (!currentBisModule) { alert('No current module set.'); return; }
    if (!serverUrl) await fetchTunnelUrl();
    const statusEl = document.getElementById('extractStatus');
    statusEl.textContent = 'Extracting topics from PDF... this may take a moment.';

    try {
        const resp = await fetch(serverUrl + '/extract-topics?module=' + encodeURIComponent(currentBisModule));
        const data = await resp.json();
        if (data.error) {
            statusEl.textContent = 'Error: ' + data.error;
        } else {
            statusEl.textContent = 'Topics extracted successfully.';
            loadProgress();
        }
    } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
    }
}

async function loadProgress() {
    if (!currentBisModule) return;
    const infoEl = document.getElementById('progressInfo');
    const barEl = document.getElementById('progressBarFill');

    try {
        const resp = await fetch(serverUrl + '/module-progress?module=' + encodeURIComponent(currentBisModule));
        const data = await resp.json();
        if (data.error) {
            infoEl.textContent = data.error;
            barEl.style.width = '0%';
            return;
        }
        if (data.finished) {
            infoEl.textContent = 'All subtopics completed for this module!';
            barEl.style.width = '100%';
        } else {
            const nextNames = data.next_batch.map(s => s.subtopic).join(', ');
            infoEl.textContent = data.completed + ' of ' + data.total_subtopics +
                ' subtopics completed. Next up: ' + nextNames;
            const pct = Math.round((data.completed / data.total_subtopics) * 100);
            barEl.style.width = pct + '%';
        }
    } catch (err) {
        infoEl.textContent = 'Error loading progress: ' + err.message;
    }
}

async function getNotes() {
    if (!currentBisModule) { alert('No current module set. Check the timetable below.'); return; }
    if (!serverUrl) await fetchTunnelUrl();
    if (!serverUrl) return;

    const outputEl = document.getElementById('notesOutputBox');
    const btn = document.getElementById('notesButton');
    btn.disabled = true;
    outputEl.textContent = 'Loading...';

    const url = serverUrl + '/notes?module=' + encodeURIComponent(currentBisModule);
    await streamToBox(url, { method: 'GET' }, outputEl, () => {
        btn.disabled = false;
        loadProgress();
    });
}

async function loadTimetable() {
    if (!serverUrl) await fetchTunnelUrl();
    if (!serverUrl) return;
    try {
        const resp = await fetch(serverUrl + '/timetable');
        const data = await resp.json();
        renderTimetable(data.modules || []);
    } catch (err) {
        document.getElementById('timetableStatus').textContent = 'Error loading timetable: ' + err.message;
    }
}

function renderTimetable(modules) {
    const container = document.getElementById('modulesContainer');
    container.innerHTML = '';
    modules.forEach(mod => addModuleBlock(mod));
}

function addModuleBlock(existing) {
    const container = document.getElementById('modulesContainer');
    const block = document.createElement('div');
    block.className = 'module-block';

    const mod = existing || { module: '', title: '', start_date: '', end_date: '' };

    block.innerHTML = `
        <input type="text" class="mod-name" placeholder="Module name e.g. mathematics (must match PDF filename)" value="${mod.module}">
        <input type="text" class="mod-title" placeholder="Module title" value="${mod.title}">
        <small class="hint">Start date</small>
        <input type="date" class="mod-start" value="${mod.start_date}">
        <small class="hint">End date</small>
        <input type="date" class="mod-end" value="${mod.end_date}">
        <button type="button" class="danger" onclick="this.closest('.module-block').remove()">Remove Module</button>
    `;

    container.appendChild(block);
}

async function saveTimetable() {
    const blocks = document.querySelectorAll('.module-block');
    const modules = [];

    blocks.forEach(block => {
        modules.push({
            module: block.querySelector('.mod-name').value.trim(),
            title: block.querySelector('.mod-title').value.trim(),
            start_date: block.querySelector('.mod-start').value,
            end_date: block.querySelector('.mod-end').value,
            subtopics: []
        });
    });

    const statusEl = document.getElementById('timetableStatus');
    statusEl.textContent = 'Saving...';

    if (!serverUrl) await fetchTunnelUrl();
    if (!serverUrl) { statusEl.textContent = 'Server not reachable.'; return; }

    try {
        const resp = await fetch(serverUrl + '/timetable', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ modules })
        });
        const data = await resp.json();
        if (data.status === 'success') {
            statusEl.textContent = 'Saved successfully.';
            loadCurrentModule();
        } else {
            statusEl.textContent = 'Failed: ' + (data.error || 'unknown error');
        }
    } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
    }
}

// ---------- Init ----------
async function init() {
    await fetchTunnelUrl();
    await pollStatus();
    await loadCurrentModule();
    await loadTimetable();
}
init();
setInterval(pollStatus, 15000);
</script>

</body>
</html>
